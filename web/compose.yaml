services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tusmo
      POSTGRES_USER: tusmo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - tusmo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tusmo -d tusmo"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 30s

  app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tusmo:${POSTGRES_PASSWORD}@db:5432/tusmo
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  tusmo_pg:
